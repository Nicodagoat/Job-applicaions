# ============================================================
# SYSTEM SETTINGS
# ============================================================

app:
  name: "Job Application Automation Platform"
  version: "1.1.0"
  debug: false
  log_level: "INFO"

# ============================================================
# DATABASE
# ============================================================
database:
  type: "sqlite"           # sqlite | postgresql
  sqlite_path: "database/jobs.db"

# ============================================================
# BACKEND API
# ============================================================
backend:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "null"               # Allows opening index.html directly from disk

# ============================================================
# SCRAPING
# ============================================================
scraping:
  headless: true
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  request_delay_seconds: 3
  max_retries: 3
  timeout_seconds: 30
  rate_limit_per_site:
    default: 10
    linkedin.com: 5
    indeed.com: 10
    glassdoor.com: 8
  respect_robots_txt: true

# ============================================================
# AI — provider is auto-detected (Ollama → Groq → OpenAI)
# ============================================================
ai:
  # Ollama settings (free, local)
  ollama_base_url: "http://localhost:11434"
  ollama_model: "llama3.1"      # or "mistral", "llama3.2", "phi3"
  # Groq model (free cloud)
  groq_model: "llama-3.1-70b-versatile"
  temperature: 0.3
  hallucination_check: true

# ============================================================
# NOTIFICATIONS
# ============================================================
notifications:
  enabled: true
  channel: "telegram"
  events:
    - "manual_input_required"
    - "application_submitted"
    - "application_failed"
    - "high_match_job_found"
    - "interview_invitation"
    - "rejection_received"
  high_match_threshold: 80

# ============================================================
# DOCUMENTS
# ============================================================
documents:
  storage_path: "documents"
  max_file_size_mb: 10
  allowed_extensions:
    - ".pdf"
    - ".docx"
    - ".doc"
    - ".txt"
  auto_select_best_resume: true

# ============================================================
# SCHEDULER (optional automated runs)
# ============================================================
scheduler:
  enabled: false
  scrape_interval_hours: 6
  report_time: "08:00"
  timezone: "Europe/London"

# ============================================================
# SAFETY — keep these as-is until you're ready
# ============================================================
safety:
  dry_run: true                  # Change to false when ready to actually submit
  log_all_actions: true
  audit_trail: true
  max_daily_applications: 10
  human_approval_required: true  # Always confirm before submitting
  block_reapplication_days: 30
